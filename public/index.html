const TYPE_COLORS = {
  normal: "#A8A77A", fire: "#EE8130", water: "#6390F0", electric: "#F0C93C",
  grass: "#7AC74C", ice: "#96D9D6", fighting: "#C22E28", poison: "#A33EA1",
  ground: "#D9A441", flying: "#A98FF3", psychic: "#F95587", bug: "#A6B91A",

// Three power tiers per type: [weak, medium, strong]. Which tiers a given
// Pokémon can roll is gated by its base stat total (see TIER_FOR_BST) so a
// weak basic like Magikarp can only ever get the weak tier, never the
// type's strongest move.
// Tier-3 power is kept within an ~80-90 band across types for balance,
// except the two signature 100-power "ultimates" (Solar Beam, Earthquake)
// which trade extra power for a cooldown — see `cooldown` below, enforced
// in resolveTurn and the move-select UI. A few moves also carry a single-
// turn `effect` (drain heals the user, recoil hurts them, flinch can skip
// the opponent's action if this move goes first) — all resolved inline
// during the same turn, no persistent status tracking required.
const TYPE_MOVES = {
  normal: [{ name: "Quick Attack", power: 40 }, { name: "Body Slam", power: 65 }, { name: "Hyper Fang", power: 80 }],
  fire: [{ name: "Ember", power: 45 }, { name: "Flame Wheel", power: 65 }, { name: "Flamethrower", power: 90 }],

  ice: [{ name: "Ice Shard", power: 45 }, { name: "Aurora Beam", power: 65 }, { name: "Ice Beam", power: 90 }],
  fighting: [{ name: "Karate Chop", power: 50 }, { name: "Brick Break", power: 65 }, { name: "Submission", power: 85, effect: { type: "recoil", amount: 0.25 } }],
  poison: [{ name: "Poison Sting", power: 40 }, { name: "Sludge", power: 65 }, { name: "Sludge Bomb", power: 80 }],
  ground: [{ name: "Mud Slap", power: 40 }, { name: "Bulldoze", power: 65 }, { name: "Earthquake", power: 100, cooldown: 1 }],
  flying: [{ name: "Gust", power: 45 }, { name: "Air Cutter", power: 60 }, { name: "Aerial Ace", power: 80 }],
  psychic: [{ name: "Confusion", power: 50 }, { name: "Psybeam", power: 65 }, { name: "Psychic", power: 90 }],
  bug: [{ name: "Bug Bite", power: 50 }, { name: "X-Scissor", power: 70 }, { name: "Megahorn", power: 90 }],
  rock: [{ name: "Rock Throw", power: 50 }, { name: "Rock Tomb", power: 65 }, { name: "Rock Slide", power: 80, effect: { type: "flinch", chance: 0.3 } }],
  ghost: [{ name: "Lick", power: 40 }, { name: "Shadow Claw", power: 65 }, { name: "Shadow Ball", power: 85 }],
  dragon: [{ name: "Dragon Breath", power: 55 }, { name: "Twister", power: 65 }, { name: "Dragon Claw", power: 85 }],
  dark: [{ name: "Bite", power: 55 }, { name: "Snarl", power: 65 }, { name: "Crunch", power: 85 }],
  steel: [{ name: "Metal Claw", power: 50 }, { name: "Steel Wing", power: 65 }, { name: "Iron Head", power: 85 }],
  fairy: [{ name: "Fairy Wind", power: 45 }, { name: "Draining Kiss", power: 65, effect: { type: "drain", amount: 0.5 } }, { name: "Moonblast", power: 90 }],
};

// Base stat total thresholds separating weak basics (e.g. Magikarp, bst
// ~200) from mid-strength Pokémon (e.g. most single-stage evolutions) from
// strong fully-evolved/legendary-tier Pokémon (e.g. Gyarados, bst ~540).
function tierForBst(bst) {
  if (bst >= 450) return 3;
  if (bst >= 320) return 2;
  return 1;
}

const CHART = {
  normal: { rock: 0.5, ghost: 0, steel: 0.5 },
  fire: { fire: 0.5, water: 0.5, grass: 2, ice: 2, bug: 2, rock: 0.5, dragon: 0.5, steel: 2 },
  water: { fire: 2, water: 0.5, grass: 0.5, ground: 2, rock: 2, dragon: 0.5 },
  electric: { water: 2, electric: 0.5, grass: 0.5, ground: 0, flying: 2, dragon: 0.5 },
  grass: { fire: 0.5, water: 2, grass: 0.5, poison: 0.5, ground: 2, flying: 0.5, bug: 0.5, rock: 2, dragon: 0.5, steel: 0.5 },
  ice: { fire: 0.5, water: 0.5, grass: 2, ice: 0.5, ground: 2, flying: 2, dragon: 2, steel: 0.5 },
  fighting: { normal: 2, ice: 2, poison: 0.5, flying: 0.5, psychic: 0.5, bug: 0.5, rock: 2, ghost: 0, dark: 2, steel: 2, fairy: 0.5 },
  poison: { grass: 2, poison: 0.5, ground: 0.5, rock: 0.5, ghost: 0.5, steel: 0, fairy: 2 },
  ground: { fire: 2, electric: 2, grass: 0.5, poison: 2, flying: 0, bug: 0.5, rock: 2, steel: 2 },
  flying: { electric: 0.5, grass: 2, fighting: 2, bug: 2, rock: 0.5, steel: 0.5 },
  psychic: { fighting: 2, poison: 2, psychic: 0.5, dark: 0, steel: 0.5 },
  bug: { fire: 0.5, grass: 2, fighting: 0.5, poison: 0.5, flying: 0.5, psychic: 2, ghost: 0.5, dark: 2, steel: 0.5, fairy: 0.5 },
  rock: { fire: 2, ice: 2, fighting: 0.5, ground: 0.5, flying: 2, bug: 2, steel: 0.5 },
  ghost: { normal: 0, psychic: 2, ghost: 2, dark: 0.5 },
  dragon: { dragon: 2, steel: 0.5, fairy: 0 },
  dark: { fighting: 0.5, psychic: 2, ghost: 2, dark: 0.5, fairy: 0.5 },
  steel: { fire: 0.5, water: 0.5, electric: 0.5, ice: 2, rock: 2, steel: 0.5, fairy: 2 },
  fairy: { fire: 0.5, fighting: 2, poison: 0.5, dragon: 2, dark: 2, steel: 0.5 },

const REGIONS = [
  { key: "kanto", label: "Kanto", gen: "I", range: [1, 151] },
  { key: "johto", label: "Johto", gen: "II", range: [152, 251] },
  { key: "hoenn", label: "Hoenn", gen: "III", range: [252, 386] },
  { key: "sinnoh", label: "Sinnoh", gen: "IV", range: [387, 493] },
  { key: "unova", label: "Unova", gen: "V", range: [494, 649] },

  { key: "galar", label: "Galar", gen: "VIII", range: [810, 905] },
  { key: "paldea", label: "Paldea", gen: "IX", range: [906, 1025] },
  { key: "all", label: "All Regions", gen: "I–IX", range: [1, 1025] },

// National Dex IDs for Legendary and Mythical Pokémon. Fixed list rather
// than fetched, since PokeAPI only exposes is_legendary/is_mythical via a
// separate per-Pokémon species lookup — doing that for every candidate
// would double the already-heavy burst of requests fired on each pick.
const LEGENDARY_IDS = new Set([
  144, 145, 146, 150, 151, // Kanto: Articuno, Zapdos, Moltres, Mewtwo, Mew
  243, 244, 245, 249, 250, 251, // Johto: Raikou, Entei, Suicune, Lugia, Ho-Oh, Celebi
  377, 378, 379, 380, 381, 382, 383, 384, 385, 386, // Hoenn: Regi trio, Latias/Latios, Kyogre, Groudon, Rayquaza, Jirachi, Deoxys
  480, 481, 482, 483, 484, 485, 486, 487, 488, 490, 491, 492, 493, // Sinnoh: lake trio, Dialga, Palkia, Heatran, Regigigas, Giratina, Cresselia, Manaphy, Darkrai, Shaymin, Arceus
  638, 639, 640, 641, 642, 643, 644, 645, 646, 647, 648, 649, // Unova: sword trio, forces of nature, Reshiram, Zekrom, Landorus, Kyurem, Keldeo, Meloetta, Genesect
  716, 717, 718, 719, 720, 721, // Kalos: Xerneas, Yveltal, Zygarde, Diancie, Hoopa, Volcanion
  772, 773, 785, 786, 787, 788, 789, 790, 791, 792, 800, 801, 802, 807, 808, 809, // Alola: Silvally line, Tapus, cosmog line, Necrozma, Magearna, Marshadow, Zeraora, Meltan line
  888, 889, 890, 891, 892, 893, 894, 895, 896, 897, 898, // Galar: Zacian, Zamazenta, Eternatus, Kubfu line, Zarude, Regieleki, Regidrago, riders, Calyrex
  1001, 1002, 1003, 1004, 1007, 1008, 1009, 1010, 1011, 1017, 1024, 1025, // Paldea: treasures of ruin, paradox legends, loyal three, Ogerpon, Terapagos, Pecharunt
]);
const MAX_LEGENDARY_PICKS = 1;

function effectiveness(moveType, defTypes) {
  let m = 1;
  defTypes.forEach((dt) => {
    const v = CHART[moveType]?.[dt];
    if (v !== undefined) m *= v;
  });
  return m;
}

function prettyName(n) {
  return n.split("-").map((w) => w[0].toUpperCase() + w.slice(1)).join(" ");
}

// tier gates which power band of each type's movepool a Pokémon can roll:
// tier 1 (weak basics) only ever gets the weakest move per type, tier 3
// (strong/fully evolved) can roll any of the three.
function buildMoveset(types, tier) {
  const pool = [{ name: "Tackle", power: 40, type: "normal" }];
  types.forEach((t) => (TYPE_MOVES[t] || []).slice(0, tier).forEach((m) => pool.push({ ...m, type: t })));
  const seen = new Set();
  const uniq = pool.filter((m) => (seen.has(m.name) ? false : (seen.add(m.name), true)));
  const rest = uniq.filter((m) => m.name !== "Tackle").sort(() => Math.random() - 0.5).slice(0, 3);
  return [uniq[0], ...rest];
}

async function fetchPokemon(id) {
  // A hung PokéAPI request (no response, no error) would otherwise stall
  // Promise.all forever and leave the draft stuck on its loading state —
  // force a hard cutoff so a single bad request can never block the pool.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  let res;
  try {
    res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`, { signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok) throw new Error("fetch failed");
  const data = await res.json();
  const types = data.types.map((t) => t.type.name);
  const statMap = {};
  data.stats.forEach((s) => (statMap[s.stat.name] = s.base_stat));
  const bst = data.stats.reduce((sum, s) => sum + s.base_stat, 0);
  const tier = tierForBst(bst);
  const maxHp = statMap.hp * 3;
  // Gen 1-5 (roughly id <= 649) have genuine animated battle sprites from
  // Black/White; anything newer falls back to the static PNG already
  // fetched above — same PokeAPI sprite repo either way, no new source.
  const animated = data.sprites.versions?.["generation-v"]?.["black-white"]?.animated;
  return {
    id: data.id,
    name: prettyName(data.name),
    types,
    stats: { hp: statMap.hp, attack: statMap.attack, defense: statMap.defense, speed: statMap.speed },
    sprites: {
      front: animated?.front_default || data.sprites.front_default,
      back: animated?.back_default || data.sprites.back_default || data.sprites.front_default,
      staticFront: data.sprites.front_default,
      staticBack: data.sprites.back_default || data.sprites.front_default,
    },
    moves: buildMoveset(types, tier),
    bst, tier,
    legendary: LEGENDARY_IDS.has(data.id),
    maxHp,
    currentHp: maxHp,
  };
}

function randUniqueIds(count, min, max) {
  const s = new Set();
  const span = max - min + 1;
  const target = Math.min(count, span);
  while (s.size < target) s.add(min + Math.floor(Math.random() * span));
  return [...s];
}

// excludeIds keeps already-picked Pokémon (this draft round) from
// reappearing in a later pick's freshly-fetched pool.
async function fetchPool(min, max, count, excludeIds) {
  const excluded = new Set(excludeIds || []);
  const seen = new Set(excluded);
  let mons = [];
  let attempts = 0;
  while (mons.length < count && attempts < 5) {
    attempts++;
    const need = count - mons.length;
    const ids = randUniqueIds(Math.ceil(need * 1.6), min, max).filter((id) => !seen.has(id));
    ids.forEach((id) => seen.add(id));
    const fetched = (await Promise.all(ids.map((id) => fetchPokemon(id).catch(() => null)))).filter(Boolean);
    mons = [...mons, ...fetched];
  }
  const dedup = new Set();
  mons = mons.filter((m) => (dedup.has(m.id) ? false : (dedup.add(m.id), true)));
  return mons.slice(0, count);
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function computeDamage(attacker, defender, move) {
  const stab = attacker.types.includes(move.type) ? 1.5 : 1;
  const eff = effectiveness(move.type, defender.types);
  const rand = 0.85 + Math.random() * 0.15;
  const crit = Math.random() < 1 / 16;
  const base = ((2 * 50 / 5 + 2) * move.power * (attacker.stats.attack / defender.stats.defense)) / 50 + 2;
  return { dmg: Math.max(1, Math.round(base * stab * eff * rand * (crit ? 1.5 : 1))), eff, crit };
}

// A turn action is either a plain number (attack move index) or
// { switchIdx } (voluntarily swap in a bench Pokémon instead of attacking).
function isSwitchAction(a) {
  return !!a && typeof a === "object" && "switchIdx" in a;
}
function isBattleAction(a) {
  return typeof a === "number" || isSwitchAction(a);
}

// A single 1v1 match between two players (identified generically as p1/p2
// rather than host/guest, since any two tournament participants can meet).
function resolveTurn(match, p1Action, p2Action) {
  const p1 = match.p1, p2 = match.p2;
  let p1Idx = match.activeIdx[p1];
  let p2Idx = match.activeIdx[p2];
  const newLog = [];

  const p1Switch = isSwitchAction(p1Action);
  const p2Switch = isSwitchAction(p2Action);
  if (p1Switch) {
    p1Idx = p1Action.switchIdx;
    newLog.push(`${match.p1Name} withdraws ${match.teams[p1][match.activeIdx[p1]].name}! Go, ${match.teams[p1][p1Idx].name}!`);
  }
  if (p2Switch) {
    p2Idx = p2Action.switchIdx;
    newLog.push(`${match.p2Name} withdraws ${match.teams[p2][match.activeIdx[p2]].name}! Go, ${match.teams[p2][p2Idx].name}!`);
  }

  const p1Mon = match.teams[p1][p1Idx];
  const p2Mon = match.teams[p2][p2Idx];
  let hp1 = p1Mon.currentHp, hp2 = p2Mon.currentHp;

  const p1MoveIdx = !p1Switch && typeof p1Action === "number" ? p1Action : null;
  const p2MoveIdx = !p2Switch && typeof p2Action === "number" ? p2Action : null;
  const steps = [];
  if (p1MoveIdx !== null) steps.push({ side: "p1", move: p1Mon.moves[p1MoveIdx] });
  if (p2MoveIdx !== null) steps.push({ side: "p2", move: p2Mon.moves[p2MoveIdx] });
  if (steps.length === 2) {
    const p1First = p1Mon.stats.speed === p2Mon.stats.speed ? Math.random() < 0.5 : p1Mon.stats.speed > p2Mon.stats.speed;
    if (!p1First) steps.reverse();
  }

  let flinchedSide = null;
  for (const step of steps) {
    if (step.side === "p1" && hp1 <= 0) continue;
    if (step.side === "p2" && hp2 <= 0) continue;
    if (flinchedSide === step.side) {
      const flinchedName = step.side === "p1" ? p1Mon.name : p2Mon.name;
      newLog.push(`${flinchedName} flinched and couldn't move!`);
      continue;
    }
    const atk = step.side === "p1" ? p1Mon : p2Mon;
    const def = step.side === "p1" ? p2Mon : p1Mon;
    const atkName = step.side === "p1" ? match.p1Name : match.p2Name;
    const { dmg, eff, crit } = computeDamage(atk, def, step.move);
    newLog.push(`${atk.name} (${atkName}) used ${step.move.name}!`);
    if (crit) newLog.push("A critical hit!");
    if (eff === 0) newLog.push("It has no effect...");
    else if (eff > 1) newLog.push("It's super effective!");
    else if (eff < 1) newLog.push("It's not very effective...");
    if (step.side === "p1") hp2 = Math.max(0, hp2 - dmg);
    else hp1 = Math.max(0, hp1 - dmg);

    // Single-turn secondary effects — resolved inline, no persistent
    // status tracking needed. Skipped entirely if the move had no effect.
    if (eff > 0 && step.move.effect) {
      const { type, amount, chance } = step.move.effect;
      if (type === "drain") {
        const heal = Math.max(1, Math.round(dmg * amount));
        if (step.side === "p1") hp1 = Math.min(p1Mon.maxHp, hp1 + heal);
        else hp2 = Math.min(p2Mon.maxHp, hp2 + heal);
        newLog.push(`${atk.name} drained health!`);
      } else if (type === "recoil") {
        const recoil = Math.max(1, Math.round(dmg * amount));
        if (step.side === "p1") hp1 = Math.max(0, hp1 - recoil);
        else hp2 = Math.max(0, hp2 - recoil);
        newLog.push(`${atk.name} is hit by recoil!`);
      } else if (type === "flinch" && Math.random() < chance) {
        flinchedSide = step.side === "p1" ? "p2" : "p1";
      }
    }
  }
  if (hp2 <= 0) newLog.push(`${p2Mon.name} fainted!`);
  if (hp1 <= 0) newLog.push(`${p1Mon.name} fainted!`);

  // Cooldowns only tick for the active Pokémon: the move just used gets
  // set to its full cooldown, every other move on that Pokémon counts
  // down by one. Benched Pokémon are untouched, so cooldowns pause while
  // switched out and resume when that Pokémon comes back in.
  const tickCooldowns = (m, usedIdx) =>
    (m.cooldowns || m.moves.map(() => 0)).map((cd, mi) => (mi === usedIdx ? (m.moves[mi].cooldown || 0) : Math.max(0, cd - 1)));

  const newP1Team = match.teams[p1].map((m, i) => (i === p1Idx ? { ...m, currentHp: hp1, cooldowns: tickCooldowns(m, p1MoveIdx) } : m));
  const newP2Team = match.teams[p2].map((m, i) => (i === p2Idx ? { ...m, currentHp: hp2, cooldowns: tickCooldowns(m, p2MoveIdx) } : m));
  const p1Alive = newP1Team.some((m) => m.currentHp > 0);
  const p2Alive = newP2Team.some((m) => m.currentHp > 0);

  let status = match.status, winner = null, pendingSwitch = null;
  if (!p1Alive) { status = "over"; winner = p2; }
  else if (!p2Alive) { status = "over"; winner = p1; }
  else if (hp2 <= 0) pendingSwitch = p2;
  else if (hp1 <= 0) pendingSwitch = p1;

  return {
    ...match,
    activeIdx: { ...match.activeIdx, [p1]: p1Idx, [p2]: p2Idx },
    teams: { ...match.teams, [p1]: newP1Team, [p2]: newP2Team },
    log: [...match.log, ...newLog],
    status, winner, pendingSwitch,
    turnCounter: (match.turnCounter || 0) + 1,
  };
}

function genCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 5; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

function nextPow2(n) {
  let p = 1;
  while (p < n) p *= 2;
  return p;
}

// Pairs players into a knockout round. If the count isn't a power of two,
// some players get a random bye straight through to the next round so the
// following round always lands back on a power of two.
// `season` makes match ids unique across "play again" restarts of the
// same room — otherwise round 1's match ids would repeat verbatim every
// new tournament, and a player's leftover local ref/state from the last
// tournament could look like it's still "the same match" and never reset.
// byeCounts tracks how many byes each player has ever received in this
// room (persists across "Play Again" reruns, only resets in a brand new
// room). Whoever has had the fewest byes gets priority for the next one,
// with a shuffle first so ties still break randomly — this is what keeps
// odd-numbered brackets fair over a long session instead of leaving it to
// pure chance every single time.
function generateRound(playerIds, roundNum, season, byeCounts) {
  const counts = byeCounts || {};
  const ranked = shuffle(playerIds).sort((a, b) => (counts[a] || 0) - (counts[b] || 0));
  const byesNeeded = nextPow2(ranked.length) - ranked.length;
  const byePlayers = ranked.slice(0, byesNeeded);
  const pairPlayers = shuffle(ranked.slice(byesNeeded));
  const matchups = [];
  let idx = 0;
  const prefix = `s${season || 1}r${roundNum}m`;
  byePlayers.forEach((pid) => {
    matchups.push({ id: `${prefix}${idx++}`, p1: pid, p2: null, winner: pid });
  });
  for (let i = 0; i < pairPlayers.length; i += 2) {
    matchups.push({ id: `${prefix}${idx++}`, p1: pairPlayers[i], p2: pairPlayers[i + 1], winner: null });
  }
  return matchups;
}

function nameOf(room, pid) {
  return room?.players?.find((p) => p.id === pid)?.name || "???";
}

// Deterministically derives a fresh match record from the room's drafted
// rosters. Safe to call more than once for the same matchup (e.g. as a
// self-heal if the record went missing) since it depends only on
// immutable room data, never on Math.random() pairing decisions.
function buildFreshMatch(room, mu) {
  const p1 = mu.p1, p2 = mu.p2;
  return {
    id: mu.id, p1, p2,
    p1Name: nameOf(room, p1), p2Name: nameOf(room, p2),
    teams: {
      [p1]: room.teams[p1].map((m) => ({ ...m, currentHp: m.maxHp, cooldowns: m.moves.map(() => 0) })),
      [p2]: room.teams[p2].map((m) => ({ ...m, currentHp: m.maxHp, cooldowns: m.moves.map(() => 0) })),
    },
    activeIdx: { [p1]: null, [p2]: null },
    status: "choose-lead",
    pendingSwitch: null,
    log: [`${nameOf(room, p1)} vs ${nameOf(room, p2)}!`],
    turnCounter: 0,
    winner: null,
  };
}

// Practice vs AI: a synthetic second "player" with a fixed id, whose
// draft and battle turns are simulated entirely inside the human's own
// browser (no server-side game logic exists in this app — the human's
// tick loop just also submits the bot's move key, same as a second real
// client would). Kept to a single 1v1 practice match, not a full bracket
// of bots.
const AI_BOT_ID = "AI_BOT";
const AI_BOT_NAME = "Wild Bot";

function aiChooseLead(team) {
  let best = 0, bestScore = -Infinity;
  team.forEach((m, i) => {
    const score = m.stats.hp + m.stats.attack + m.stats.defense + m.stats.speed + Math.random() * 20;
    if (score > bestScore) { bestScore = score; best = i; }
  });
  return best;
}

function aiChooseSwitch(team, oppActive, excludeIdx) {
  let best = -1, bestScore = -Infinity;
  team.forEach((m, i) => {
    if (m.currentHp <= 0 || i === excludeIdx) return;
    let incomingEff = 0;
    oppActive.types.forEach((t) => { incomingEff += effectiveness(t, m.types); });
    const hpFrac = m.currentHp / m.maxHp;
    const score = -incomingEff * 10 + hpFrac * 5 + Math.random() * 3;
    if (score > bestScore) { bestScore = score; best = i; }
  });
  return best;
}

function aiPickMove(mon, oppActive) {
  const options = mon.moves
    .map((m, i) => ({ i, m }))
    .filter(({ m, i }) => !(mon.cooldowns && mon.cooldowns[i] > 0));
  if (options.length === 0) return 0;
  const scored = options
    .map(({ i, m }) => ({ i, score: m.power * effectiveness(m.type, oppActive.types) + Math.random() * 15 }))
    .sort((a, b) => b.score - a.score);
  // Mostly picks its best option, occasionally picks a weaker one so it
  // isn't perfectly predictable to play against.
  if (scored.length === 1 || Math.random() < 0.75) return scored[0].i;
  return scored[Math.floor(Math.random() * Math.min(3, scored.length))].i;
}

// Returns the bot's action for whatever phase the match is currently in,
// or null if it's not the bot's turn to act right now.
function computeAiAction(match, aiSide) {
  const oppSide = aiSide === match.p1 ? match.p2 : match.p1;
  if (match.status === "choose-lead") {
    return { leadIdx: aiChooseLead(match.teams[aiSide]) };
  }
  if (match.pendingSwitch === aiSide) {
    const idx = aiChooseSwitch(match.teams[aiSide], match.teams[oppSide][match.activeIdx[oppSide]], match.activeIdx[aiSide]);
    return idx >= 0 ? { switchIdx: idx } : null;
  }
  if (match.status === "battle" && !match.pendingSwitch) {
    const mon = match.teams[aiSide][match.activeIdx[aiSide]];
    const opp = match.teams[oppSide][match.activeIdx[oppSide]];
    const hpFrac = mon.currentHp / mon.maxHp;
    if (hpFrac < 0.3 && Math.random() < 0.5) {
      const switchIdx = aiChooseSwitch(match.teams[aiSide], opp, match.activeIdx[aiSide]);
      if (switchIdx >= 0) return { switchIdx };
    }
    return aiPickMove(mon, opp);
  }
  return null;
}

// Shared draft-kickoff used by both a normal tournament start and an AI
// practice room: builds each player's private draft pool, except the bot
// (if present) whose team is picked instantly rather than shown a pool.
async function beginDraft(code, roomObj) {
  const region = REGIONS.find((r) => r.key === roomObj.region) || REGIONS[0];
  await Promise.all(roomObj.players.map(async (p) => {
    if (p.id === AI_BOT_ID) {
      const picks = shuffle(await fetchPool(region.range[0], region.range[1], roomObj.teamSize));
      await storageSet(draftKeyFor(code, p.id), { pool: [], picks, done: true });
    } else {
      const pool = shuffle(await fetchPool(region.range[0], region.range[1], 10));
      await storageSet(draftKeyFor(code, p.id), { pool, picks: [], done: false });
    }
  }));
  const updated = { ...roomObj, status: "drafting", draftParticipants: roomObj.players.map((p) => p.id), draftRound: 1, rev: roomObj.rev + 1 };
  await storageSet(roomKey(code), updated);
  return updated;
}

// Real backend now: shared state lives on the server (KV REST API), and
// "personal" (non-shared) state lives in the browser's own localStorage
// so an id/room survives a refresh without leaking across devices.
async function storageGet(key, shared = true) {
  try {
    if (!shared) {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
    const res = await fetch(`/api/kv/${encodeURIComponent(key)}`);
    if (res.status === 404) return null;
    if (!res.ok) return null;
    const r = await res.json();
    return r && r.value !== undefined ? JSON.parse(r.value) : null;
  } catch {
    return null;
  }
}
async function storageSet(key, value, shared = true) {
  try {
    if (!shared) {
      localStorage.setItem(key, JSON.stringify(value));
      return;
    }
    await fetch(`/api/kv/${encodeURIComponent(key)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: JSON.stringify(value) }),
    });
  } catch (e) {
    console.error("storage set failed", e);
  }
}
async function storageDelete(key, shared = true) {
  try {
    if (!shared) {
      localStorage.removeItem(key);
      return;
    }
    await fetch(`/api/kv/${encodeURIComponent(key)}`, { method: "DELETE" });
  } catch {
    // key may not exist yet - fine to ignore
  }
}

const roomKey = (code) => `pkmn-room-${code}`;
// Each player's draft is private and lives under their own key — no
// contention even with up to 8 people drafting at once.
const draftKeyFor = (code, playerId) => `pkmn-draft-${code}-${playerId}`;
// Each 1v1 match in the bracket is its own record, so concurrently running
// matches (e.g. 4 at once in an 8-player round 1) never contend with
// each other.
const matchKey = (code, matchId) => `pkmn-match-${code}-${matchId}`;
// Each player writes their in-match action to their OWN key (never a
// shared read-modify-write key) — avoids a last-write-wins race when both
// players in a match act at once.
const moveKeyFor = (code, matchId, playerId) => `pkmn-mv-${code}-${matchId}-${playerId}`;
// A quick emoji taunt sent to the opponent — written by the sender under
// the RECEIVER's id, so it's a one-way mailbox with no write contention.
const reactKeyFor = (code, matchId, targetPlayerId) => `pkmn-react-${code}-${matchId}-${targetPlayerId}`;
// Personal (non-shared, per-user) keys used to survive a page refresh.
const PERSONAL_ID_KEY = "pkmn-my-player-id";
const ACTIVE_ROOM_KEY = "pkmn-active-room";

// Any connected client can attempt to resolve/advance shared state (not
// just the host), so the game never stalls just because one tab lost
// focus. Since multiple clients could race to apply the same transition,
// re-check the expected "version" field hasn't already moved before
// committing — whoever loses the race just skips writing; their update is
// discarded and the next poll picks up whatever the winner wrote.
async function commitIfRevMatches(key, fresh, updated) {
  const check = await storageGet(key);
  if (!check || check.rev !== fresh.rev) return false;
  await storageSet(key, updated);
  return true;
}
async function commitIfTurnMatches(key, fresh, updated) {
  const check = await storageGet(key);
  if (!check || check.turnCounter !== fresh.turnCounter) return false;
  await storageSet(key, updated);
  return true;
}

// Tiny synthesized sound effects — no audio files to fetch/host, just a
// few oscillator beeps. Browsers block audio until a user gesture has
// happened somewhere on the page; since every player has already clicked
// a button by the time battle sounds fire, this works in practice, and
// every call is wrapped so a blocked/missing AudioContext never throws.
let audioCtx = null;
function getAudioCtx() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return audioCtx;
  } catch {
    return null;
  }
}
function beep(freq, duration, type, gainLevel, delay) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const start = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainLevel || 0.15, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  } catch {
    // audio is a nice-to-have, never let it break the game
  }
}
function playSfx(name) {
  if (name === "hit") beep(170, 0.12, "square", 0.16);
  else if (name === "crit") { beep(140, 0.06, "square", 0.2); beep(280, 0.14, "square", 0.2, 0.07); }
  else if (name === "faint") { beep(320, 0.09, "sawtooth", 0.14); beep(220, 0.09, "sawtooth", 0.14, 0.1); beep(120, 0.22, "sawtooth", 0.14, 0.2); }
  else if (name === "lock") beep(520, 0.06, "square", 0.1);
  else if (name === "reaction") beep(880, 0.08, "sine", 0.12);
  else if (name === "victory") [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.2, "square", 0.15, i * 0.14));
}

function TypeChip({ t }) {

    <span style={{ background: TYPE_COLORS[t] || "#888" }} className="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase text-white tracking-wide">

}
// Shows a Pokémon's move-power tier (1-3) so trainers can see at a glance
// whether it's a weak basic or a strong fully-evolved pick before drafting.
function TierStars({ tier }) {

function LegendaryBadge() {

function HpBar({ hp, maxHp }) {
  const clampedHp = Math.max(0, hp);
  const pct = Math.max(0, (clampedHp / maxHp) * 100);
  const color = pct > 50 ? "#3FA796" : pct > 20 ? "#E8B23D" : "#D64545";
  return (
    <div className="w-full">
      <div style={{ background: "#1c1e2a", border: "2px solid #262433" }} className="w-full h-3 rounded-full overflow-hidden">
        <div style={{ width: `${pct}%`, background: color, transition: "width 0.4s ease" }} className="h-full" />
      </div>
      <div style={{ color, fontVariantNumeric: "tabular-nums" }} className="text-[10px] font-bold mt-0.5">
        {clampedHp} / {maxHp} HP
      </div>
    </div>
  );
}
// Sprite images load directly from raw.githubusercontent.com in the
// viewer's own browser (not proxied through our server), and that CDN can
// transiently rate-limit a burst of ~10 simultaneous requests when a draft
// pool renders. Retrying with backoff (remounting via `key` to force a
// fresh request) clears up almost all of these without the player ever
// seeing a broken-image icon.
// Retries the primary src (typically an animated GIF) with backoff; once
// exhausted, falls back to a static image (e.g. the regular PNG sprite)
// before finally giving up. Covers both "CDN burst rate-limited" and
// "this Pokémon has no animated sprite for some other reason" cases.
function useResilientImg(src, fallbackSrc, maxAttempts) {
  const [attempt, setAttempt] = useState(0);
  const [usingFallback, setUsingFallback] = useState(false);
  const [failed, setFailed] = useState(false);
  useEffect(() => { setAttempt(0); setUsingFallback(false); setFailed(false); }, [src, fallbackSrc]);
  const onError = () => {
    if (attempt < (maxAttempts || 3)) {
      setTimeout(() => setAttempt((a) => a + 1), 500 * (attempt + 1));
    } else if (fallbackSrc && fallbackSrc !== src && !usingFallback) {
      setUsingFallback(true);
      setAttempt(0);
    } else {
      setFailed(true);
    }
  };
  const currentSrc = usingFallback ? fallbackSrc : src;
  return { attempt, failed, onError, currentSrc };
}

function Sprite({ src, fallbackSrc, alt, flip }) {
  const { attempt, failed, onError, currentSrc } = useResilientImg(src, fallbackSrc);
  return currentSrc && !failed ? (
    <img
      key={`${currentSrc}-${attempt}`}
      src={currentSrc}
      alt={alt}
      onError={onError}
      style={{ imageRendering: "pixelated", transform: flip ? "scaleX(-1)" : "none" }}
      className="w-24 h-24 object-contain drop-shadow-lg"
    />
  ) : (
    <div className="w-24 h-24 flex items-center justify-center text-4xl">❓</div>
  );
}

function SmallSprite({ src, fallbackSrc, alt, className }) {
  const { attempt, failed, onError, currentSrc } = useResilientImg(src, fallbackSrc);
  return currentSrc && !failed ? (
    <img key={`${currentSrc}-${attempt}`} src={currentSrc} alt={alt} onError={onError} style={{ imageRendering: "pixelated" }} className={className} />
  ) : (
    <div className={`${className} flex items-center justify-center text-lg`}>❓</div>
  );
}

// Derives a type's full effectiveness profile from CHART: which types it
// hits hard (2x), which resist it (0.5x), and which are immune (0x).
// Anything not listed is average (1x) — omission carries that meaning.
function typeRelations(t) {
  const strong = [], weak = [], immune = [];
  Object.keys(TYPE_COLORS).forEach((def) => {
    const v = CHART[t]?.[def];
    if (v === 2) strong.push(def);
    else if (v === 0) immune.push(def);
    else if (v === 0.5) weak.push(def);
  });
  return { strong, weak, immune };
}

function TypeChart({ onClose }) {
  const types = Object.keys(TYPE_COLORS);
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(18,20,28,0.97)", zIndex: 70, overflowY: "auto" }} className="p-4">
      <div className="max-w-md mx-auto flex flex-col gap-4 pb-10">

          <div style={{ fontFamily: "'Press Start 2P', monospace", fontSize: "11px" }} className="text-[#E8B23D]">TYPE CHART</div>
          <button onClick={onClose} style={{ background: "#D64545" }} className="text-white text-xs font-bold px-3 py-1.5 rounded-lg active:scale-95 transition">CLOSE</button>
        </div>
        <p className="text-xs opacity-70 -mt-2">What each type does extra, reduced, or zero damage against. Anything not listed is average (1×) damage.</p>
        <div className="flex flex-col gap-2">
          {types.map((t) => {
            const { strong, weak, immune } = typeRelations(t);
            return (
              <div key={t} style={{ background: "#EFE6D0", color: "#262433", border: "3px solid #262433" }} className="rounded-xl p-3">
                <div className="mb-2"><TypeChip t={t} /></div>
                <div className="text-xs flex flex-col gap-1.5">
                  <div className="flex flex-wrap gap-1 items-center">
                    <span className="font-bold text-[#3FA796] mr-1">Strong vs</span>
                    {strong.length ? strong.map((d) => <TypeChip key={d} t={d} />) : <span className="opacity-50">none</span>}
                  </div>
                  <div className="flex flex-wrap gap-1 items-center">
                    <span className="font-bold text-[#D64545] mr-1">Weak vs</span>
                    {weak.length ? weak.map((d) => <TypeChip key={d} t={d} />) : <span className="opacity-50">none</span>}
                  </div>
                  {immune.length > 0 && (
                    <div className="flex flex-wrap gap-1 items-center">
                      <span className="font-bold mr-1" style={{ color: "#4A4361" }}>No effect vs</span>
                      {immune.map((d) => <TypeChip key={d} t={d} />)}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Confetti() {
