function PokemonDraftBattleMultiplayer() {
  const [myId, setMyId] = useState(null);
  const [initializing, setInitializing] = useState(true);
  const [myName, setMyName] = useState("");
  const [screen, setScreen] = useState("home"); // home, create, join, lobby, draft, bracket, over
  const [selectedRegion, setSelectedRegion] = useState("kanto");
  const [joinCode, setJoinCode] = useState("");
  const [roomCodeState, setRoomCodeState] = useState("");
  const [room, setRoom] = useState(null);
  const [match, setMatch] = useState(null);
  const [myDraft, setMyDraft] = useState(null);
  const [loading, setLoading] = useState(false);
  const [startingTournament, setStartingTournament] = useState(false);
  const [error, setError] = useState("");
  const [mySubmitted, setMySubmitted] = useState(false);
  const [showSwitchMenu, setShowSwitchMenu] = useState(false);
  const [picking, setPicking] = useState(false);
  const [copyLabel, setCopyLabel] = useState("Copy code");
  const [showTypeChart, setShowTypeChart] = useState(false);
  const [shake, setShake] = useState({ mine: false, opp: false });
  const [floatText, setFloatText] = useState({ mine: null, opp: null });
  const [incomingReaction, setIncomingReaction] = useState(null);
  const [spectateMatchId, setSpectateMatchId] = useState(null);
  const [spectatedMatch, setSpectatedMatch] = useState(null);
  const turnCounterRef = useRef(0);
  const currentMatchIdRef = useRef(null);
  const pickLockRef = useRef(false);
  const logEndRef = useRef(null);
  const prevHpRef = useRef({ myHp: null, oppHp: null, myMonId: null, oppMonId: null });
  const prevLogLenRef = useRef(0);
  const lastReactionTsRef = useRef(0);
  const victoryPlayedRef = useRef(false);

  // Restore identity + rejoin an in-progress room after a page refresh.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      let id = await storageGet(PERSONAL_ID_KEY, false);
      if (!id) {
        id = Math.random().toString(36).slice(2) + Date.now().toString(36);
        await storageSet(PERSONAL_ID_KEY, id, false);
      }
      if (cancelled) return;
      setMyId(id);

      const active = await storageGet(ACTIVE_ROOM_KEY, false);
      if (active && active.code) {
        const r = await storageGet(roomKey(active.code), true);
        if (r && r.players.some((p) => p.id === id)) {
          setMyName(active.name || nameOf(r, id) || "");
          setRoomCodeState(active.code);
          setRoom(r);
          if (r.status === "lobby") setScreen("lobby");
          else if (r.status === "drafting") setScreen("draft");
          else if (r.status === "bracket") setScreen("bracket");
          else if (r.status === "over") setScreen("over");
        } else {
          await storageDelete(ACTIVE_ROOM_KEY, false);
        }
      }
      if (!cancelled) setInitializing(false);
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    logEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [match?.log?.length]);

  // Unified poll loop: keeps room/draft/match state fresh, and lets this
  // client help resolve shared transitions (draft complete → bracket,
  // round complete → next round, choose-lead / battle turns).
  useEffect(() => {
    if (!myId || !["lobby", "draft", "bracket", "over"].includes(screen) || !roomCodeState) return;
    let cancelled = false;
    const tick = async () => {
      let fresh = await storageGet(roomKey(roomCodeState));
      if (!fresh || cancelled) return;

      if (fresh.status === "drafting") {
        // Every round (including round 1) drafts from a brand-new private
        // pool, so trainers rebuild their team round to round instead of
        // running the same 4 Pokémon through the whole knockout.
        const participants = fresh.draftParticipants || fresh.players.map((p) => p.id);
        if (participants.includes(myId)) {
          // Skip while a pick is actively being submitted so a poll tick
          // landing mid-flight can never clobber the in-progress update
          // with the pre-pick pool.
          if (!pickLockRef.current) {
            const mine = await storageGet(draftKeyFor(roomCodeState, myId));
            if (mine) setMyDraft(mine);
          }
        } else {
          setMyDraft(null);
        }

        const draftStates = await Promise.all(participants.map((pid) => storageGet(draftKeyFor(roomCodeState, pid))));
        const allDone = draftStates.length > 0 && draftStates.every((d) => d && d.done);
        if (allDone) {
          const latest = await storageGet(roomKey(roomCodeState));
          if (latest && latest.status === "drafting" && latest.rev === fresh.rev) {
            const teams = { ...(latest.teams || {}) };
            participants.forEach((pid, i) => {
              teams[pid] = draftStates[i].picks.map((m) => ({ ...m, currentHp: m.maxHp }));
            });
            const roundNum = latest.draftRound || 1;
            const matchups = generateRound(participants, roundNum, latest.season, latest.byeCounts);
            const byeCounts = { ...(latest.byeCounts || {}) };
            matchups.forEach((mu) => { if (!mu.p2) byeCounts[mu.p1] = (byeCounts[mu.p1] || 0) + 1; });
            const updated = { ...latest, status: "bracket", teams, bracket: { round: roundNum, matchups }, byeCounts, rev: latest.rev + 1 };
            const ok = await commitIfRevMatches(roomKey(roomCodeState), latest, updated);
            if (ok) {
              await Promise.all(matchups.filter((m) => m.p2).map((mu) => storageSet(matchKey(roomCodeState, mu.id), buildFreshMatch(updated, mu))));
              fresh = updated;
            }
          }
        }
      } else if (fresh.status === "bracket") {
        // Try to advance the round once every matchup (including byes) has a winner.
        if (fresh.bracket.matchups.every((m) => m.winner)) {
          const winners = fresh.bracket.matchups.map((m) => m.winner);
          const latest = await storageGet(roomKey(roomCodeState));
          if (latest && latest.status === "bracket" && latest.rev === fresh.rev) {
            if (winners.length === 1) {
              const updated = { ...latest, status: "over", champion: winners[0], rev: latest.rev + 1 };
              const ok = await commitIfRevMatches(roomKey(roomCodeState), latest, updated);
              if (ok) fresh = updated;
            } else {
              // Survivors re-draft a fresh team before the next round pairs up.
              const nextRound = latest.bracket.round + 1;
              const region = REGIONS.find((r) => r.key === latest.region) || REGIONS[0];
              const pools = await Promise.all(winners.map(async (pid) => ({
                id: pid,
                pool: shuffle(await fetchPool(region.range[0], region.range[1], 10)),
              })));
              const updated = { ...latest, status: "drafting", draftParticipants: winners, draftRound: nextRound, rev: latest.rev + 1 };
              const ok = await commitIfRevMatches(roomKey(roomCodeState), latest, updated);
              if (ok) {
                await Promise.all(pools.map(({ id, pool }) => storageSet(draftKeyFor(roomCodeState, id), { pool, picks: [], done: false })));
                fresh = updated;
              }
            }
          }
        }

        if (fresh.status === "bracket") {
          const myMu = fresh.bracket.matchups.find((m) => !m.winner && (m.p1 === myId || m.p2 === myId));
          if (myMu) {
            const mKey = matchKey(roomCodeState, myMu.id);
            let freshMatch = await storageGet(mKey);
            if (!freshMatch) {
              freshMatch = buildFreshMatch(fresh, myMu);
              await storageSet(mKey, freshMatch);
            }
            if (currentMatchIdRef.current !== myMu.id) {
              currentMatchIdRef.current = myMu.id;
              turnCounterRef.current = freshMatch.turnCounter || 0;
              setMySubmitted(false);
              setShowSwitchMenu(false);
              prevHpRef.current = { myHp: null, oppHp: null, myMonId: null, oppMonId: null };
              prevLogLenRef.current = 0;
              lastReactionTsRef.current = 0;
            }

            // The AI bot has no real client of its own — the human's tick
            // loop submits its move on its behalf, exactly like a second
            // real player would, so the rest of the resolution logic below
            // needs no special-casing for it.
            if (fresh.vsAI) {
              const aiSide = myMu.p1 === AI_BOT_ID ? myMu.p1 : myMu.p2 === AI_BOT_ID ? myMu.p2 : null;
              if (aiSide) {
                const existingAiMove = await storageGet(moveKeyFor(roomCodeState, myMu.id, aiSide));
                if (existingAiMove === null) {
                  const aiAction = computeAiAction(freshMatch, aiSide);
                  if (aiAction !== null) await storageSet(moveKeyFor(roomCodeState, myMu.id, aiSide), aiAction);
                }
              }
            }

            const incomingReact = await storageGet(reactKeyFor(roomCodeState, myMu.id, myId));
            if (incomingReact && incomingReact.ts !== lastReactionTsRef.current) {
              lastReactionTsRef.current = incomingReact.ts;
              setIncomingReaction(incomingReact.emoji);
              playSfx("reaction");
              setTimeout(() => setIncomingReaction(null), 2200);
            }

            if (freshMatch.status === "choose-lead") {
              const p1Lead = await storageGet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p1));
              const p2Lead = await storageGet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p2));
              const validLead = (v) => v && typeof v === "object" && typeof v.leadIdx === "number";
              if (validLead(p1Lead) && validLead(p2Lead)) {
                const updated = {
                  ...freshMatch,
                  status: "battle",
                  activeIdx: { [freshMatch.p1]: p1Lead.leadIdx, [freshMatch.p2]: p2Lead.leadIdx },
                  log: [
                    ...freshMatch.log,
                    `${freshMatch.p1Name} sends out ${freshMatch.teams[freshMatch.p1][p1Lead.leadIdx].name}!`,
                    `${freshMatch.p2Name} sends out ${freshMatch.teams[freshMatch.p2][p2Lead.leadIdx].name}!`,
                  ],
                  turnCounter: (freshMatch.turnCounter || 0) + 1,
                };
                if (await commitIfTurnMatches(mKey, freshMatch, updated)) {
                  await storageSet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p1), null);
                  await storageSet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p2), null);
                  freshMatch = updated;
                }
              }
            } else if (freshMatch.status === "battle") {
              const p1Move = await storageGet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p1));
              const p2Move = await storageGet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p2));
              if (freshMatch.pendingSwitch) {
                const need = freshMatch.pendingSwitch;
                const mv = need === freshMatch.p1 ? p1Move : p2Move;
                if (mv && typeof mv === "object" && "switchIdx" in mv) {
                  const mon = freshMatch.teams[need][mv.switchIdx];
                  const nameOfNeed = need === freshMatch.p1 ? freshMatch.p1Name : freshMatch.p2Name;
                  const updated = {
                    ...freshMatch,
                    activeIdx: { ...freshMatch.activeIdx, [need]: mv.switchIdx },
                    pendingSwitch: null,
                    log: [...freshMatch.log, `${nameOfNeed} sends out ${mon.name}!`],
                    turnCounter: (freshMatch.turnCounter || 0) + 1,
                  };
                  if (await commitIfTurnMatches(mKey, freshMatch, updated)) {
                    await storageSet(moveKeyFor(roomCodeState, myMu.id, need), null);
                    freshMatch = updated;
                  }
                }
              } else if (isBattleAction(p1Move) && isBattleAction(p2Move)) {
                const updated = resolveTurn(freshMatch, p1Move, p2Move);
                if (await commitIfTurnMatches(mKey, freshMatch, updated)) {
                  await storageSet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p1), null);
                  await storageSet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p2), null);
                  freshMatch = updated;
                }
              }
            } else if (freshMatch.status === "over" && !myMu.winner) {
              const latestRoom = await storageGet(roomKey(roomCodeState));
              if (latestRoom && latestRoom.status === "bracket") {
                const target = latestRoom.bracket.matchups.find((m) => m.id === myMu.id);
                if (target && !target.winner) {
                  const mus = latestRoom.bracket.matchups.map((m) => (m.id === myMu.id ? { ...m, winner: freshMatch.winner } : m));
                  const updated = { ...latestRoom, bracket: { ...latestRoom.bracket, matchups: mus }, rev: latestRoom.rev + 1 };
                  const ok = await commitIfRevMatches(roomKey(roomCodeState), latestRoom, updated);
                  if (ok) fresh = updated;
                }
              }
            }

            if (freshMatch.turnCounter !== turnCounterRef.current) {
              turnCounterRef.current = freshMatch.turnCounter;
              setMySubmitted(false);
              setShowSwitchMenu(false);
            }
            setMatch(freshMatch);
          } else {
            currentMatchIdRef.current = null;
            setMatch(null);
          }
        }
      }

      if (cancelled) return;
      setRoom(fresh);
      if (fresh.status === "lobby") setScreen("lobby");
      else if (fresh.status === "drafting") setScreen("draft");
      else if (fresh.status === "bracket") setScreen("bracket");
      else if (fresh.status === "over") setScreen("over");
    };
    tick();
    const id = setInterval(tick, 1800);
    return () => { cancelled = true; clearInterval(id); };
  }, [screen, roomCodeState, myId]);

  // A new round means new match ids — any match a spectator was watching
  // no longer exists, so drop back to the bracket overview.
  useEffect(() => {
    setSpectateMatchId(null);
    setSpectatedMatch(null);
  }, [room?.bracket?.round]);

  // Spectating is strictly read-only: just poll and display, never submit
  // actions or attempt to resolve turns for a match that isn't yours.
  useEffect(() => {
    if (!spectateMatchId || !roomCodeState) { setSpectatedMatch(null); return; }
    let cancelled = false;
    const poll = async () => {
      const m = await storageGet(matchKey(roomCodeState, spectateMatchId));
      if (!cancelled) setSpectatedMatch(m);
    };
    poll();
    const id = setInterval(poll, 1800);
    return () => { cancelled = true; clearInterval(id); };
  }, [spectateMatchId, roomCodeState]);

  async function createRoom() {
    if (!myName.trim()) { setError("Enter your name first."); return; }
    setLoading(true); setError("");
    try {
      const code = genCode();
      const region = REGIONS.find((r) => r.key === selectedRegion) || REGIONS[0];
      const initial = {
        code, region: region.key, regionLabel: region.label,
        hostId: myId, hostName: myName.trim(),
        players: [{ id: myId, name: myName.trim() }],
        maxPlayers: 8, teamSize: 4,
        status: "lobby", teams: null, bracket: null, champion: null,
        draftParticipants: null, draftRound: 0, season: 1, byeCounts: {},
        rev: 0, createdAt: Date.now(),
      };
      await storageSet(roomKey(code), initial);
      await storageSet(ACTIVE_ROOM_KEY, { code, name: myName.trim() }, false);
      setRoomCodeState(code);
      setRoom(initial);
      setScreen("lobby");
    } catch {
      setError("Couldn't create the room. Try again.");
    }
    setLoading(false);
  }

  async function joinRoom() {
    if (!myName.trim() || !joinCode.trim()) { setError("Enter your name and a room code."); return; }
    setLoading(true); setError("");
    const code = joinCode.trim().toUpperCase();
    const existing = await storageGet(roomKey(code));
    if (!existing) { setError("Room not found. Double-check the code."); setLoading(false); return; }
    const already = existing.players.some((p) => p.id === myId);
    if (!already) {
      if (existing.status !== "lobby") { setError("This tournament has already started."); setLoading(false); return; }
      if (existing.players.length >= existing.maxPlayers) { setError("That room is full (8/8)."); setLoading(false); return; }
      const updated = { ...existing, players: [...existing.players, { id: myId, name: myName.trim() }], rev: existing.rev + 1 };
      const ok = await commitIfRevMatches(roomKey(code), existing, updated);
      if (!ok) { setError("Someone else joined at the same instant — try again."); setLoading(false); return; }
    }
    await storageSet(ACTIVE_ROOM_KEY, { code, name: myName.trim() }, false);
    const latest = await storageGet(roomKey(code));
    setRoomCodeState(code);
    setRoom(latest);
    if (latest.status === "lobby") setScreen("lobby");
    else if (latest.status === "drafting") setScreen("draft");
    else if (latest.status === "bracket") setScreen("bracket");
    else setScreen("over");
    setLoading(false);
  }

  async function startTournament() {
    if (!room || room.hostId !== myId || room.status !== "lobby" || room.players.length < 2) return;
    setStartingTournament(true); setError("");
    try {
      const latest = await storageGet(roomKey(roomCodeState));
      if (!latest || latest.hostId !== myId || latest.status !== "lobby" || latest.players.length < 2) { setStartingTournament(false); return; }
      const updated = await beginDraft(roomCodeState, latest);
      setRoom(updated);
    } catch {
      setError("Couldn't reach the Pokédex network. Try again.");
    }
    setStartingTournament(false);
  }

  // A solo practice room: you + one AI opponent, skipping the lobby wait
  // entirely since there's no one else to wait for.
  async function createAiRoom() {
    if (!myName.trim()) { setError("Enter your name first."); return; }
    setLoading(true); setError("");
    try {
      const code = genCode();
      const region = REGIONS.find((r) => r.key === selectedRegion) || REGIONS[0];
      const initial = {
        code, region: region.key, regionLabel: region.label,
        hostId: myId, hostName: myName.trim(),
        players: [{ id: myId, name: myName.trim() }, { id: AI_BOT_ID, name: AI_BOT_NAME }],
        maxPlayers: 2, teamSize: 4,
        status: "lobby", teams: null, bracket: null, champion: null,
        draftParticipants: null, draftRound: 0, season: 1, byeCounts: {}, vsAI: true,
        rev: 0, createdAt: Date.now(),
      };
      await storageSet(roomKey(code), initial);
      const updated = await beginDraft(code, initial);
      await storageSet(ACTIVE_ROOM_KEY, { code, name: myName.trim() }, false);
      setRoomCodeState(code);
      setRoom(updated);
      setScreen("draft");
    } catch {
      setError("Couldn't start practice match. Try again.");
    }
    setLoading(false);
  }

  // Resets the SAME room back to its lobby so everyone can run it back
  // without anyone having to re-share or re-enter the room code.
  async function playAgain() {
    if (!room || room.hostId !== myId || room.status !== "over") return;
    setStartingTournament(true); setError("");
    const latest = await storageGet(roomKey(roomCodeState));
    if (!latest || latest.hostId !== myId || latest.status !== "over") { setStartingTournament(false); return; }
    const updated = {
      ...latest,
      status: "lobby", teams: null, bracket: null, champion: null,
      draftParticipants: null, draftRound: 0, season: (latest.season || 1) + 1,
      rev: latest.rev + 1,
    };
    const ok = await commitIfRevMatches(roomKey(roomCodeState), latest, updated);
    if (ok) {
      setMatch(null); setMyDraft(null); setMySubmitted(false); setShowSwitchMenu(false);
      setSpectateMatchId(null); setSpectatedMatch(null);
      currentMatchIdRef.current = null; turnCounterRef.current = 0; victoryPlayedRef.current = false;
      if (updated.vsAI) {
        const redrafted = await beginDraft(roomCodeState, updated);
        setRoom(redrafted); setScreen("draft");
      } else {
        setRoom(updated); setScreen("lobby");
      }
    } else {
      setError("Couldn't restart — try again.");
    }
    setStartingTournament(false);
  }

  async function pickMon(mon) {
    if (pickLockRef.current) return;
    pickLockRef.current = true;
    setPicking(true);
    try {
      const latest = await storageGet(draftKeyFor(roomCodeState, myId));
      if (!latest || latest.done || latest.picks.length >= (room?.teamSize || 4)) return;
      const legendariesSoFar = latest.picks.filter((p) => p.legendary).length;
      if (mon.legendary && legendariesSoFar >= MAX_LEGENDARY_PICKS) return;
      const newPicks = [...latest.picks, mon];
      const done = newPicks.length >= (room?.teamSize || 4);
      // Each pick burns its pool — the next pick gets a whole new set of
      // options fetched fresh, not just the leftovers from this one.
      let newPool = [];
      if (!done) {
        try {
          const region = REGIONS.find((r) => r.key === room?.region) || REGIONS[0];
          newPool = shuffle(await fetchPool(region.range[0], region.range[1], 10, newPicks.map((p) => p.id)));
        } catch {
          newPool = shuffle(latest.pool.filter((p) => p.id !== mon.id));
        }
      }
      const updated = { pool: newPool, picks: newPicks, done };
      await storageSet(draftKeyFor(roomCodeState, myId), updated);
      setMyDraft(updated);
    } finally {
      pickLockRef.current = false;
      setPicking(false);
    }
  }

  async function submitLead(idx) {
    if (mySubmitted || !match || match.status !== "choose-lead") return;
    playSfx("lock");
    setMySubmitted(true);
    await storageSet(moveKeyFor(roomCodeState, match.id, myId), { leadIdx: idx });
  }
  // A regular turn action: either attack with a move, or voluntarily
  // swap in a bench Pokémon instead of attacking this turn.
  async function submitAction(action) {
    if (mySubmitted || !match || match.status !== "battle" || match.pendingSwitch) return;
    if (typeof action === "number" && (myActive?.cooldowns?.[action] || 0) > 0) return;
    playSfx("lock");
    setMySubmitted(true);
    setShowSwitchMenu(false);
    await storageSet(moveKeyFor(roomCodeState, match.id, myId), action);
  }
  async function submitAttack(moveIdx) {
    await submitAction(moveIdx);
  }
  async function submitVoluntarySwitch(idx) {
    await submitAction({ switchIdx: idx });
  }
  // A forced switch after your active Pokémon faints (no attack involved).
  async function submitSwitch(idx) {
    if (mySubmitted || !match || match.pendingSwitch !== myId) return;
    playSfx("lock");
    setMySubmitted(true);
    await storageSet(moveKeyFor(roomCodeState, match.id, myId), { switchIdx: idx });
  }
  // A quick emoji taunt for the opponent mid-battle — purely for fun, has
  // no effect on the match itself.
  async function sendReaction(emoji) {
    if (!match || !otherPid) return;
    playSfx("reaction");
    await storageSet(reactKeyFor(roomCodeState, match.id, otherPid), { emoji, ts: Date.now() });
  }

  function leaveRoom() {
    storageDelete(ACTIVE_ROOM_KEY, false);
    setScreen("home"); setRoom(null); setMatch(null); setMyDraft(null);
    setRoomCodeState(""); setJoinCode(""); setError(""); setMySubmitted(false); setShowSwitchMenu(false);
    setSpectateMatchId(null); setSpectatedMatch(null);
    turnCounterRef.current = 0; currentMatchIdRef.current = null; victoryPlayedRef.current = false;
  }

  useEffect(() => {
    if (screen === "over" && room && !victoryPlayedRef.current) {
      victoryPlayedRef.current = true;
      playSfx("victory");
    }
  }, [screen, room]);

  function copyCode() {
    const shareUrl = `${location.origin}${location.pathname}?join=${roomCodeState}`;
    navigator.clipboard?.writeText(shareUrl).then(() => {
      setCopyLabel("Copied!");
      setTimeout(() => setCopyLabel("Copy link"), 1500);
    });
  }

  // If someone opens a shared "?join=CODE" link, prefill the join screen.
  useEffect(() => {
    if (!initializing && screen === "home") {
      const params = new URLSearchParams(location.search);
      const code = params.get("join");
      if (code) {
        setJoinCode(code.toUpperCase());
        setScreen("join");
      }
    }
  }, [initializing]);

  const bg = { background: "#12141C", minHeight: "100%", fontFamily: "Rubik, sans-serif" };
  const display = { fontFamily: "'Press Start 2P', monospace" };
  const panel = { background: "#EFE6D0", color: "#262433", border: "3px solid #262433" };

  const otherPid = match ? (myId === match.p1 ? match.p2 : match.p1) : null;
  const otherPname = match ? (myId === match.p1 ? match.p2Name : match.p1Name) : "";
  const myTeam = match?.teams?.[myId];
  const oppTeam = match?.teams?.[otherPid];
  const myActive = myTeam?.[match?.activeIdx?.[myId]];
  const oppActive = oppTeam?.[match?.activeIdx?.[otherPid]];

  // Battle "juice": whenever an active Pokémon's HP drops between renders
  // (and it's still the same mon, not a fresh switch-in), flash/shake its
  // panel and pop a floating damage number. Crit/super-effective flavor is
  // read straight off the newly-appended log lines rather than needing a
  // separate event schema on the match object.
  useEffect(() => {
    if (!match || !myActive || !oppActive) return;
    const newLines = (match.log || []).slice(prevLogLenRef.current).join(" ");
    const crit = newLines.includes("critical hit");
    const noEff = newLines.includes("no effect");
    const prev = prevHpRef.current;
    if (prev.oppMonId === oppActive.id && typeof prev.oppHp === "number" && oppActive.currentHp < prev.oppHp && !noEff) {
      const dmg = prev.oppHp - oppActive.currentHp;
      playSfx(crit ? "crit" : "hit");
      setShake((s) => ({ ...s, opp: true }));
      setFloatText((f) => ({ ...f, opp: { amount: dmg, crit, key: Date.now() } }));
      setTimeout(() => setShake((s) => ({ ...s, opp: false })), 400);
      setTimeout(() => setFloatText((f) => ({ ...f, opp: null })), 900);
    }
    if (prev.myMonId === myActive.id && typeof prev.myHp === "number" && myActive.currentHp < prev.myHp && !noEff) {
      const dmg = prev.myHp - myActive.currentHp;
      playSfx(crit ? "crit" : "hit");
      setShake((s) => ({ ...s, mine: true }));
      setFloatText((f) => ({ ...f, mine: { amount: dmg, crit, key: Date.now() } }));
      setTimeout(() => setShake((s) => ({ ...s, mine: false })), 400);
      setTimeout(() => setFloatText((f) => ({ ...f, mine: null })), 900);
    }
    if (newLines.includes("fainted")) playSfx("faint");
    prevHpRef.current = { myHp: myActive.currentHp, oppHp: oppActive.currentHp, myMonId: myActive.id, oppMonId: oppActive.id };
    prevLogLenRef.current = (match.log || []).length;
  }, [match?.log?.length, myActive?.currentHp, oppActive?.currentHp, myActive?.id, oppActive?.id]);

  return (
    <div style={bg} className="w-full min-h-full flex flex-col items-center p-3 text-[#EFE6D0]">
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700;900&display=swap');`}</style>

      {showTypeChart && <TypeChart onClose={() => setShowTypeChart(false)} />}

      <div className="w-full max-w-md flex items-center justify-between mt-2 mb-2">
        <div style={{ width: 74 }} />
        <h1 style={{ ...display, color: "#E8B23D", fontSize: "12px", lineHeight: 1.6 }} className="text-center">
          DRAFT &amp; BATTLE · ONLINE
        </h1>
        <button
          onClick={() => setShowTypeChart(true)}
          style={{ background: "#EFE6D0", color: "#262433" }}
          className="text-[10px] font-bold px-2 py-1.5 rounded-lg active:scale-95 transition whitespace-nowrap"
        >
          📖 Types
        </button>
      </div>

      {initializing && (
        <div className="mt-16 text-center opacity-80 text-sm animate-pulse">Reconnecting…</div>
      )}

      {!initializing && screen === "home" && (
        <div className="flex flex-col items-center gap-4 mt-6 w-full max-w-xs">
          <p className="text-sm opacity-80 text-center">Draft a team from any generation and battle 1–7 friends in a knockout bracket. Share a room code to play.</p>
          <input
            value={myName} onChange={(e) => setMyName(e.target.value)} placeholder="Your trainer name"
            style={{ background: "#EFE6D0", color: "#262433" }} className="w-full rounded-lg px-3 py-2 text-sm"
          />
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={() => setScreen("create")} style={{ background: "#D64545", ...display, fontSize: "10px" }} className="w-full px-4 py-3 rounded-xl text-white active:scale-95 transition">
            HOST A ROOM
          </button>
          <button onClick={() => setScreen("join")} style={{ background: "#3FA796", ...display, fontSize: "10px" }} className="w-full px-4 py-3 rounded-xl text-white active:scale-95 transition">
            JOIN A ROOM
          </button>
        </div>
      )}

      {screen === "create" && (
        <div className="flex flex-col items-center gap-3 w-full max-w-sm">
          <input
            value={myName} onChange={(e) => setMyName(e.target.value)} placeholder="Your trainer name"
            style={{ background: "#EFE6D0", color: "#262433" }} className="w-full rounded-lg px-3 py-2 text-sm"
          />
          <div style={{ ...display, fontSize: "10px" }} className="text-[#E8B23D]">CHOOSE A REGION</div>
          <div className="grid grid-cols-2 gap-2 w-full">
            {REGIONS.map((r) => (
              <button
                key={r.key} onClick={() => setSelectedRegion(r.key)}
                style={{ background: selectedRegion === r.key ? "#E8B23D" : "#EFE6D0", color: "#262433", border: "3px solid #262433" }}
                className="rounded-xl p-2 text-left"
              >
                <div className="font-bold text-xs">{r.label}</div>
                <div className="text-[10px] opacity-70">Gen {r.gen}</div>
              </button>
            ))}
          </div>
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={createRoom} disabled={loading} style={{ background: "#D64545", ...display, fontSize: "10px" }} className="w-full px-4 py-3 rounded-xl text-white disabled:opacity-60">
            {loading ? "SUMMONING…" : "CREATE ROOM"}
          </button>
          <button onClick={createAiRoom} disabled={loading} style={{ background: "#3FA796", ...display, fontSize: "10px" }} className="w-full px-4 py-3 rounded-xl text-white disabled:opacity-60">
            {loading ? "SUMMONING…" : "PRACTICE VS AI"}
          </button>
          <button onClick={() => setScreen("home")} className="text-xs opacity-60 underline">back</button>
        </div>
      )}

      {screen === "join" && (
        <div className="flex flex-col items-center gap-3 w-full max-w-xs">
          <input
            value={myName} onChange={(e) => setMyName(e.target.value)} placeholder="Your trainer name"
            style={{ background: "#EFE6D0", color: "#262433" }} className="w-full rounded-lg px-3 py-2 text-sm"
          />
          <input
            value={joinCode} onChange={(e) => setJoinCode(e.target.value.toUpperCase())} placeholder="ROOM CODE"
            style={{ background: "#EFE6D0", color: "#262433", ...display, fontSize: "11px", letterSpacing: "2px" }}
            className="w-full rounded-lg px-3 py-3 text-center"
          />
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={joinRoom} disabled={loading} style={{ background: "#3FA796", ...display, fontSize: "10px" }} className="w-full px-4 py-3 rounded-xl text-white disabled:opacity-60">
            {loading ? "JOINING…" : "JOIN ROOM"}
          </button>
          <button onClick={() => setScreen("home")} className="text-xs opacity-60 underline">back</button>
        </div>
      )}

      {screen === "lobby" && room && (
        <div className="flex flex-col items-center gap-4 mt-6 text-center w-full max-w-xs">
          <div style={{ ...display, fontSize: "9px" }} className="text-[#3FA796]">ROOM CODE</div>
          <div style={{ ...display, fontSize: "22px", letterSpacing: "4px", color: "#E8B23D" }}>{roomCodeState}</div>
          <button onClick={copyCode} style={{ background: "#EFE6D0", color: "#262433" }} className="px-3 py-1 rounded-lg text-xs font-bold">{copyLabel}</button>
          <p className="text-xs opacity-70 max-w-xs">{room.regionLabel} knockout · 2–8 players · Share the code (or copied link) with friends.</p>
          <div className="w-full flex flex-col gap-1">
            {room.players.map((p) => (
              <div key={p.id} style={panel} className="rounded-lg px-3 py-2 text-left text-sm font-bold">
                {p.name}{p.id === room.hostId ? " (Host)" : ""}{p.id === myId ? " · You" : ""}
              </div>
            ))}
          </div>
          <div className="text-xs opacity-60">{room.players.length} / {room.maxPlayers} joined</div>
          {room.hostId === myId ? (
            <button
              onClick={startTournament}
              disabled={room.players.length < 2 || startingTournament}
              style={{ background: "#D64545", ...display, fontSize: "10px" }}
              className="w-full px-4 py-3 rounded-xl text-white disabled:opacity-50"
            >
              {startingTournament ? "SUMMONING…" : room.players.length < 2 ? "NEED 2+ PLAYERS" : `START KNOCKOUT (${room.players.length})`}
            </button>
          ) : (
            <div className="animate-pulse text-xs opacity-60">Waiting for host to start…</div>
          )}
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={leaveRoom} className="text-xs opacity-60 underline">leave</button>
        </div>
      )}

      {screen === "draft" && room && (
        <div className="w-full max-w-md flex flex-col gap-3">
          <div style={{ ...display, fontSize: "9px" }} className="text-center text-[#3FA796]">
            DRAFT YOUR TEAM{room.draftRound ? ` · ROUND ${room.draftRound}` : ""}
          </div>
          {room.draftParticipants && !room.draftParticipants.includes(myId) ? (
            <div className="text-center text-xs opacity-70 py-10">You were eliminated — spectating while the remaining trainers draft for round {room.draftRound}…</div>
          ) : !myDraft ? (
            <div className="text-center text-xs opacity-70 py-6 animate-pulse">Summoning your Pokédex…</div>
          ) : myDraft.done ? (
            <div className="text-center text-xs opacity-70 py-6">Team locked in! Waiting for other trainers…</div>
          ) : picking ? (
            <div className="text-center text-xs opacity-70 py-6 animate-pulse">Finding your next options…</div>
          ) : (
            <>
              <div className="text-[10px] text-center opacity-60">
                {room.regionLabel} · Pick {myDraft.picks.length + 1} of {room.teamSize} · Legendaries {myDraft.picks.filter((p) => p.legendary).length}/{MAX_LEGENDARY_PICKS}
              </div>
              <div className="grid grid-cols-2 gap-2">
                {myDraft.pool.map((mon) => {
                  const legendaryCapped = mon.legendary && myDraft.picks.filter((p) => p.legendary).length >= MAX_LEGENDARY_PICKS;
                  return (
                    <button key={mon.id} onClick={() => pickMon(mon)} disabled={picking || legendaryCapped}
                      style={panel} className="rounded-2xl p-2 flex flex-col items-center gap-1 active:scale-95 transition disabled:opacity-60">
                      <Sprite src={mon.sprites.front} fallbackSrc={mon.sprites.staticFront} alt={mon.name} />
                      <div className="font-bold text-xs">{mon.name}</div>
                      <TierStars tier={mon.tier} />
                      {mon.legendary && <LegendaryBadge />}
                      <div className="flex gap-1">{mon.types.map((t) => <TypeChip key={t} t={t} />)}</div>
                      {legendaryCapped && <div className="text-[9px] text-[#D64545] font-bold">Limit reached</div>}
                    </button>
                  );
                })}
              </div>
            </>
          )}
          {myDraft && myDraft.picks.length > 0 && (
            <div className="flex gap-1 flex-wrap justify-center mt-1">
              {myDraft.picks.map((m) => <SmallSprite key={m.id} src={m.sprites.front} fallbackSrc={m.sprites.staticFront} alt={m.name} className="w-9 h-9" />)}
            </div>
          )}
        </div>
      )}

      {screen === "bracket" && room && (
        match ? (
          <div className="w-full max-w-md flex flex-col gap-2">
            <div style={{ ...display, fontSize: "9px" }} className="text-center text-[#E8B23D]">ROUND {room.bracket?.round}</div>

            {match.status === "choose-lead" ? (
              <div className="flex flex-col gap-3">
                <div style={{ ...display, fontSize: "10px" }} className="text-center text-[#E8B23D]">CHOOSE YOUR LEAD POKÉMON</div>
                <p className="text-xs text-center opacity-70">vs {otherPname}</p>
                {mySubmitted ? (
                  <div className="text-center text-xs opacity-70 py-4">Lead locked in — waiting for {otherPname}…</div>
                ) : (
                  <div className="grid grid-cols-2 gap-2">
                    {match.teams[myId].map((m, i) => (
                      <button key={m.id} onClick={() => submitLead(i)} style={panel} className="rounded-2xl p-2 flex flex-col items-center gap-1 active:scale-95 transition">
                        <Sprite src={m.sprites.front} fallbackSrc={m.sprites.staticFront} alt={m.name} />
                        <div className="font-bold text-xs">{m.name}</div>
                        <TierStars tier={m.tier} />
                        <div className="flex gap-1">{m.types.map((t) => <TypeChip key={t} t={t} />)}</div>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            ) : myActive && oppActive ? (
              <>
                {incomingReaction && (
                  <div
                    key={incomingReaction + Date.now()}
                    style={{ position: "fixed", top: "18%", left: "50%", transform: "translateX(-50%)", fontSize: "64px", zIndex: 60, animation: "pkmn-pop-in 0.3s ease" }}
                    className="pointer-events-none drop-shadow-lg"
                  >
                    {incomingReaction}
                  </div>
                )}

                <div style={panel} className={`rounded-2xl p-3 flex items-center justify-between ${shake.opp ? "pkmn-shake-anim" : ""}`}>
                  <div className="flex-1">
                    <div className="font-bold text-sm">{oppActive.name} <span className="text-[10px] opacity-60">({otherPname})</span></div>
                    <div className="flex gap-1 my-1">{oppActive.types.map((t) => <TypeChip key={t} t={t} />)}</div>
                    <HpBar hp={oppActive.currentHp} maxHp={oppActive.maxHp} />
                  </div>
                  <div style={{ position: "relative" }} className={shake.opp ? "pkmn-flash-anim" : ""}>
                    <Sprite src={oppActive.sprites.front} fallbackSrc={oppActive.sprites.staticFront} alt="opponent" />
                    {floatText.opp && (
                      <div
                        key={floatText.opp.key}
                        style={{ position: "absolute", top: "-4px", right: "-4px", fontFamily: "'Press Start 2P', monospace", fontSize: floatText.opp.crit ? "16px" : "13px", color: floatText.opp.crit ? "#E8B23D" : "#D64545", animation: "pkmn-float-up 0.85s ease forwards", textShadow: "1px 1px 0 #12141C" }}
                      >
                        -{floatText.opp.amount}
                      </div>
                    )}
                  </div>
                </div>

                <div style={panel} className={`rounded-2xl p-3 flex items-center justify-between ${shake.mine ? "pkmn-shake-anim" : ""}`}>
                  <div style={{ position: "relative" }} className={shake.mine ? "pkmn-flash-anim" : ""}>
                    <Sprite src={myActive.sprites.back} fallbackSrc={myActive.sprites.staticBack} alt="you" />
                    {floatText.mine && (
                      <div
                        key={floatText.mine.key}
                        style={{ position: "absolute", top: "-4px", left: "-4px", fontFamily: "'Press Start 2P', monospace", fontSize: floatText.mine.crit ? "16px" : "13px", color: floatText.mine.crit ? "#E8B23D" : "#D64545", animation: "pkmn-float-up 0.85s ease forwards", textShadow: "1px 1px 0 #12141C" }}
                      >
                        -{floatText.mine.amount}
                      </div>
                    )}
                  </div>
                  <div className="flex-1 text-right">
                    <div className="font-bold text-sm">{myActive.name} <span className="text-[10px] opacity-60">(You)</span></div>
                    <div className="flex gap-1 my-1 justify-end">{myActive.types.map((t) => <TypeChip key={t} t={t} />)}</div>
                    <HpBar hp={myActive.currentHp} maxHp={myActive.maxHp} />
                  </div>
                </div>

                <div style={{ background: "#0d0e14", border: "3px solid #262433" }} className="rounded-xl p-3 h-24 overflow-y-auto text-xs leading-relaxed">
                  {(match.log || []).slice(-6).map((l, i) => <div key={i}>{l}</div>)}
                  <div ref={logEndRef} />
                </div>

                <div className="flex gap-2 justify-center">
                  {["😤", "😂", "🔥", "😱", "👏"].map((e) => (
                    <button key={e} onClick={() => sendReaction(e)} style={{ background: "#1c1e2a", border: "2px solid #262433" }} className="text-lg px-2 py-1 rounded-lg active:scale-90 transition">
                      {e}
                    </button>
                  ))}
                </div>

                {match.pendingSwitch === myId && (
                  mySubmitted ? (
                    <div className="text-center text-xs opacity-70 py-2">Switch locked in — waiting for {otherPname}…</div>
                  ) : (
                    <div className="flex flex-col gap-2">
                      <div style={{ ...display, fontSize: "9px" }} className="text-center text-[#D64545]">CHOOSE YOUR NEXT POKÉMON</div>
                      <div className="grid grid-cols-3 gap-2">
                        {myTeam.map((m, i) => (
                          <button key={m.id} disabled={m.currentHp <= 0} onClick={() => submitSwitch(i)} style={panel} className="rounded-xl p-2 flex flex-col items-center disabled:opacity-30">
                            <SmallSprite src={m.sprites.front} fallbackSrc={m.sprites.staticFront} alt={m.name} className="w-12 h-12" />
                            <div className="text-[10px] font-bold">{m.name}</div>
                          </button>
                        ))}
                      </div>
                    </div>
                  )
                )}

                {match.pendingSwitch && match.pendingSwitch !== myId && (
                  <div className="text-center text-xs opacity-70 py-2">{otherPname} is choosing their next Pokémon…</div>
                )}

                {!match.pendingSwitch && (
                  mySubmitted ? (
                    <div className="text-center text-xs opacity-70 py-2">Locked in — waiting for {otherPname}…</div>
                  ) : showSwitchMenu ? (
                    <div className="flex flex-col gap-2">
                      <div style={{ ...display, fontSize: "9px" }} className="text-center text-[#3FA796]">SWITCH TO…</div>
                      <div className="grid grid-cols-3 gap-2">
                        {myTeam.map((m, i) => (
                          <button
                            key={m.id}
                            disabled={m.currentHp <= 0 || i === match.activeIdx[myId]}
                            onClick={() => submitVoluntarySwitch(i)}
                            style={panel}
                            className="rounded-xl p-2 flex flex-col items-center disabled:opacity-30"
                          >
                            <SmallSprite src={m.sprites.front} fallbackSrc={m.sprites.staticFront} alt={m.name} className="w-12 h-12" />
                            <div className="text-[10px] font-bold">{m.name}</div>
                          </button>
                        ))}
                      </div>
                      <button onClick={() => setShowSwitchMenu(false)} className="text-xs opacity-60 underline">back to moves</button>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-2">
                      <div className="grid grid-cols-2 gap-2">
                        {myActive.moves.map((m, i) => {
                          const onCooldown = (myActive.cooldowns?.[i] || 0) > 0;
                          return (
                            <button
                              key={m.name} onClick={() => submitAttack(i)} disabled={onCooldown}
                              style={{ background: TYPE_COLORS[m.type] || "#888" }}
                              className="rounded-xl p-2 text-white text-left active:scale-95 transition disabled:opacity-40"
                            >
                              <div className="font-bold text-xs">{m.name}</div>
                              <div className="text-[10px] opacity-90">{onCooldown ? "RECHARGING…" : `${m.type.toUpperCase()} · PWR ${m.power}`}</div>
                            </button>
                          );
                        })}
                      </div>
                      {myTeam.some((m, i) => m.currentHp > 0 && i !== match.activeIdx[myId]) && (
                        <button onClick={() => setShowSwitchMenu(true)} style={{ background: "#262433", ...display, fontSize: "9px" }} className="w-full px-3 py-2 rounded-xl text-[#EFE6D0] active:scale-95 transition">
                          SWITCH POKÉMON
                        </button>
                      )}
                    </div>
                  )
                )}

                <div className="flex gap-1 justify-center mt-1">
                  {myTeam.map((m, i) => (
                    <div key={m.id} style={{ opacity: m.currentHp <= 0 ? 0.3 : i === match.activeIdx[myId] ? 1 : 0.7, border: i === match.activeIdx[myId] ? "2px solid #E8B23D" : "2px solid transparent" }} className="rounded-lg p-0.5">
                      <SmallSprite src={m.sprites.front} fallbackSrc={m.sprites.staticFront} alt={m.name} className="w-8 h-8" />
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <div className="text-center text-xs opacity-70 py-6">Loading match…</div>
            )}
          </div>
        ) : spectateMatchId ? (
          <SpectatorView spectatedMatch={spectatedMatch} onBack={() => setSpectateMatchId(null)} />
        ) : (
          <BracketOverview room={room} myId={myId} onWatch={setSpectateMatchId} />
        )
      )}

      {screen === "over" && room && (
        <div className="flex flex-col items-center gap-3 mt-10">
          <Confetti />
          <div style={{ ...display, fontSize: "13px", color: room.champion === myId ? "#3FA796" : "#E8B23D" }}>
            {room.champion === myId ? "YOU ARE THE CHAMPION!" : "TOURNAMENT OVER"}
          </div>
          <p className="text-xs opacity-70">{nameOf(room, room.champion)} wins the {room.players.length}-player knockout!</p>
          {room.hostId === myId && (
            <button onClick={playAgain} disabled={startingTournament} style={{ background: "#3FA796", ...display, fontSize: "10px" }} className="px-4 py-3 rounded-xl text-white disabled:opacity-60">
              {startingTournament ? "RESETTING…" : "PLAY AGAIN · SAME ROOM"}
            </button>
          )}
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={leaveRoom} style={{ background: "#D64545", ...display, fontSize: "10px" }} className="px-4 py-2 rounded-lg text-white">
            LEAVE / NEW ROOM
          </button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PokemonDraftBattleMultiplayer />);
</script>
<script>
  // Babel Standalone's default "react" preset now targets the automatic
  // JSX runtime (imports from "react/jsx-runtime"), which doesn't exist
  // as a global when using the classic React/ReactDOM UMD builds above.
  // Transform manually with the classic runtime so JSX compiles to
  // React.createElement calls against the global `React`.
  (function () {
    const source = document.getElementById("app-source").textContent;
    try {
      const { code } = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      });
      (0, eval)(code);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<pre style="color:#D64545;background:#12141C;padding:16px;white-space:pre-wrap;">App failed to start:\n' +
        (e && e.message ? e.message : String(e)) +
        "</pre>";
      console.error(e);
    }
  })();
</script>
</body>
</html>
